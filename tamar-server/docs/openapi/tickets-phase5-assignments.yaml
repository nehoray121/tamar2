{
  "openapi": "3.1.0",
  "info": {
    "title": "Tamar Ticket Assignments API",
    "version": "5.0.0",
    "description": "Phase 5 atomic assignment-set management, eligible Room-user discovery, immutable assignment history and all-or-nothing bulk assignment operations."
  },
  "servers": [{ "url": "/api" }],
  "security": [{ "bearerAuth": [] }],
  "paths": {
    "/tickets/{id}/assignees": {
      "parameters": [{ "$ref": "#/components/parameters/TicketId" }],
      "put": {
        "operationId": "replaceTicketAssignees",
        "summary": "Replace the complete active assignment set on an OPEN Ticket",
        "parameters": [{ "$ref": "#/components/parameters/IfMatch" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ReplaceAssigneesRequest" } } } },
        "responses": {
          "200": { "description": "Assignment set replaced atomically", "headers": { "ETag": { "$ref": "#/components/headers/ETag" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/TicketResponse" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "428": { "$ref": "#/components/responses/PreconditionRequired" }
        }
      }
    },
    "/tickets/{id}/assignable-users": {
      "parameters": [{ "$ref": "#/components/parameters/TicketId" }],
      "get": {
        "operationId": "listAssignableTicketUsers",
        "summary": "List active direct Room members eligible for assignment",
        "parameters": [
          { "$ref": "#/components/parameters/Page" },
          { "$ref": "#/components/parameters/AssignableLimit" },
          { "name": "search", "in": "query", "schema": { "type": "string", "maxLength": 100 } },
          { "name": "includeAssigned", "in": "query", "schema": { "type": "boolean", "default": true } }
        ],
        "responses": {
          "200": { "description": "Stable paginated safe user summaries", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AssignableUsersResponse" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" }
        }
      }
    },
    "/tickets/{id}/assignments": {
      "parameters": [{ "$ref": "#/components/parameters/TicketId" }],
      "get": {
        "operationId": "listTicketAssignments",
        "summary": "List authorized active and ended assignment history",
        "parameters": [
          { "name": "view", "in": "query", "schema": { "type": "string", "enum": ["ACTIVE", "HISTORY", "ALL"], "default": "ALL" } },
          { "$ref": "#/components/parameters/Page" },
          { "$ref": "#/components/parameters/HistoryLimit" },
          { "name": "sortDirection", "in": "query", "schema": { "type": "string", "enum": ["asc", "desc"], "default": "asc" } }
        ],
        "responses": {
          "200": { "description": "Safe assignment history page", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AssignmentsResponse" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      }
    },
    "/tickets/bulk/assignees": {
      "post": {
        "operationId": "bulkUpdateTicketAssignees",
        "summary": "Apply one assignment operation atomically to up to 50 same-Room Tickets",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/BulkAssigneesRequest" } } } },
        "responses": {
          "200": { "description": "All changed tickets committed", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/BulkAssigneesResponse" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" }
        }
      }
    }
  },
  "components": {
    "securitySchemes": { "bearerAuth": { "type": "http", "scheme": "bearer", "bearerFormat": "SSO access token" } },
    "headers": { "ETag": { "description": "Quoted explicit Ticket version", "schema": { "type": "string" } } },
    "parameters": {
      "TicketId": { "name": "id", "in": "path", "required": true, "schema": { "$ref": "#/components/schemas/ObjectId" } },
      "IfMatch": { "name": "If-Match", "in": "header", "required": true, "schema": { "type": "string" } },
      "Page": { "name": "page", "in": "query", "schema": { "type": "integer", "minimum": 1, "default": 1 } },
      "AssignableLimit": { "name": "limit", "in": "query", "schema": { "type": "integer", "minimum": 1, "maximum": 100, "default": 25 } },
      "HistoryLimit": { "name": "limit", "in": "query", "schema": { "type": "integer", "minimum": 1, "maximum": 100, "default": 50 } }
    },
    "schemas": {
      "ObjectId": { "type": "string", "pattern": "^[a-fA-F0-9]{24}$" },
      "SafeUserSummary": {
        "type": "object", "additionalProperties": false, "required": ["id", "displayName", "email"],
        "properties": { "id": { "$ref": "#/components/schemas/ObjectId" }, "displayName": { "type": ["string", "null"] }, "email": { "type": ["string", "null"] } }
      },
      "ReplaceAssigneesRequest": {
        "type": "object", "additionalProperties": false, "required": ["assigneeIds"],
        "properties": { "assigneeIds": { "type": "array", "maxItems": 50, "items": { "$ref": "#/components/schemas/ObjectId" } } }
      },
      "BulkTicketVersion": {
        "type": "object", "additionalProperties": false, "required": ["ticketId", "expectedVersion"],
        "properties": { "ticketId": { "$ref": "#/components/schemas/ObjectId" }, "expectedVersion": { "type": "integer", "minimum": 1 } }
      },
      "BulkAssigneesRequest": {
        "type": "object", "additionalProperties": false, "required": ["operation", "tickets", "assigneeIds"],
        "properties": {
          "operation": { "type": "string", "enum": ["ADD", "REMOVE", "REPLACE"] },
          "tickets": { "type": "array", "minItems": 1, "maxItems": 50, "items": { "$ref": "#/components/schemas/BulkTicketVersion" } },
          "assigneeIds": { "type": "array", "maxItems": 50, "items": { "$ref": "#/components/schemas/ObjectId" } }
        }
      },
      "Ticket": {
        "type": "object",
        "required": ["id", "ticketNumber", "activeAssigneeIds", "activeAssignees", "version", "capabilities"],
        "properties": {
          "id": { "$ref": "#/components/schemas/ObjectId" },
          "ticketNumber": { "type": "string" },
          "activeAssigneeIds": { "type": "array", "items": { "$ref": "#/components/schemas/ObjectId" } },
          "activeAssignees": { "type": "array", "items": { "$ref": "#/components/schemas/SafeUserSummary" } },
          "version": { "type": "integer", "minimum": 1 },
          "capabilities": { "type": "object", "properties": { "canAssign": { "type": "boolean" } } }
        }
      },
      "AssignableUser": {
        "type": "object", "additionalProperties": false,
        "required": ["id", "displayName", "email", "eligibleRoomRole", "isCurrentlyAssigned"],
        "properties": {
          "id": { "$ref": "#/components/schemas/ObjectId" },
          "displayName": { "type": "string" },
          "email": { "type": ["string", "null"] },
          "eligibleRoomRole": { "type": "string", "enum": ["ROOM_USER", "ROOM_MANAGER"] },
          "isCurrentlyAssigned": { "type": "boolean" }
        }
      },
      "Assignment": {
        "type": "object", "additionalProperties": false,
        "properties": {
          "id": { "$ref": "#/components/schemas/ObjectId" }, "user": { "$ref": "#/components/schemas/SafeUserSummary" },
          "roomId": { "$ref": "#/components/schemas/ObjectId" }, "assignedBy": { "$ref": "#/components/schemas/SafeUserSummary" },
          "assignedAt": { "type": "string", "format": "date-time" }, "source": { "type": "string", "enum": ["SINGLE", "BULK"] },
          "isActive": { "type": "boolean" }, "endedBy": { "oneOf": [{ "$ref": "#/components/schemas/SafeUserSummary" }, { "type": "null" }] },
          "endedAt": { "type": ["string", "null"], "format": "date-time" },
          "endedReason": { "type": ["string", "null"], "enum": ["MANUAL_REMOVAL", "BULK_REMOVAL", "REPLACED_ASSIGNMENT_SET", "TICKET_TRANSFERRED", null] }
        }
      },
      "Pagination": {
        "type": "object", "properties": { "page": { "type": "integer" }, "limit": { "type": "integer" }, "totalItems": { "type": "integer" }, "totalPages": { "type": "integer" }, "hasNext": { "type": "boolean" }, "hasPrevious": { "type": "boolean" } }
      },
      "TicketResponse": { "type": "object", "properties": { "success": { "const": true }, "data": { "$ref": "#/components/schemas/Ticket" } } },
      "AssignableUsersResponse": { "type": "object", "properties": { "success": { "const": true }, "data": { "type": "object", "properties": { "items": { "type": "array", "items": { "$ref": "#/components/schemas/AssignableUser" } }, "pagination": { "$ref": "#/components/schemas/Pagination" } } } } },
      "AssignmentsResponse": { "type": "object", "properties": { "success": { "const": true }, "data": { "type": "object", "properties": { "items": { "type": "array", "items": { "$ref": "#/components/schemas/Assignment" } }, "pagination": { "$ref": "#/components/schemas/Pagination" }, "view": { "type": "string" }, "sort": { "type": "object" } } } } },
      "BulkResult": { "type": "object", "properties": { "ticketId": { "$ref": "#/components/schemas/ObjectId" }, "ticketNumber": { "type": "string" }, "version": { "type": "integer" }, "activeAssigneeCount": { "type": "integer" }, "addedCount": { "type": "integer" }, "removedCount": { "type": "integer" } } },
      "BulkAssigneesResponse": { "type": "object", "properties": { "success": { "const": true }, "data": { "type": "object", "properties": { "operation": { "type": "string" }, "results": { "type": "array", "items": { "$ref": "#/components/schemas/BulkResult" } } } } } },
      "Error": { "type": "object", "properties": { "success": { "const": false }, "error": { "type": "object", "properties": { "code": { "type": "string" }, "message": { "type": "string" }, "fieldErrors": { "type": ["object", "null"] }, "requestId": { "type": "string" } } } } }
    },
    "responses": {
      "BadRequest": { "description": "VALIDATION_ERROR, BULK_ASSIGNMENT_LIMIT_EXCEEDED or BULK_ASSIGNMENT_MIXED_ROOMS", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "Unauthorized": { "description": "Missing or invalid SSO access token", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "Forbidden": { "description": "ASSIGNMENT_FORBIDDEN", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "NotFound": { "description": "TICKET_NOT_FOUND or non-enumerating assignment discovery denial", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "Conflict": { "description": "VERSION_CONFLICT, EMPTY_ASSIGNMENT_CHANGE, ASSIGNMENT_TICKET_CLOSED, ASSIGNMENT_SCOPE_INACTIVE, ASSIGNMENT_TARGET_INACTIVE, ASSIGNMENT_TARGET_NOT_IN_ROOM, ASSIGNMENT_TARGET_INELIGIBLE, ASSIGNMENT_DUPLICATE or BULK_ASSIGNMENT_FAILED", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "PreconditionRequired": { "description": "PRECONDITION_REQUIRED", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
    }
  }
}
