{
  "openapi": "3.1.0",
  "info": {
    "title": "Tamar Ticket Core API",
    "version": "4.0.0",
    "description": "Phase 4 ticket creation, scoped views, optimistic editing, closure and immutable business history."
  },
  "servers": [{ "url": "/api" }],
  "security": [{ "bearerAuth": [] }],
  "paths": {
    "/tickets": {
      "get": {
        "operationId": "listTickets",
        "summary": "List authorized tickets",
        "description": "Bounded escaped contains search over ticketNumber, subject and description. Authorization is always applied before user filters.",
        "parameters": [
          { "$ref": "#/components/parameters/View" },
          { "$ref": "#/components/parameters/Page" },
          { "$ref": "#/components/parameters/Limit" },
          { "name": "search", "in": "query", "schema": { "type": "string", "maxLength": 100 } },
          { "name": "systemId", "in": "query", "schema": { "$ref": "#/components/schemas/ObjectId" } },
          { "name": "environmentId", "in": "query", "schema": { "$ref": "#/components/schemas/ObjectId" } },
          { "name": "subEnvironmentId", "in": "query", "schema": { "$ref": "#/components/schemas/ObjectId" } },
          { "name": "roomId", "in": "query", "schema": { "$ref": "#/components/schemas/ObjectId" } },
          { "name": "priority", "in": "query", "schema": { "$ref": "#/components/schemas/TicketPriority" } },
          { "name": "createdBy", "in": "query", "schema": { "$ref": "#/components/schemas/ObjectId" } },
          { "name": "createdFrom", "in": "query", "schema": { "type": "string", "format": "date-time" } },
          { "name": "createdTo", "in": "query", "schema": { "type": "string", "format": "date-time" } },
          { "name": "updatedFrom", "in": "query", "schema": { "type": "string", "format": "date-time" } },
          { "name": "updatedTo", "in": "query", "schema": { "type": "string", "format": "date-time" } },
          { "name": "closedFrom", "in": "query", "schema": { "type": "string", "format": "date-time" } },
          { "name": "closedTo", "in": "query", "schema": { "type": "string", "format": "date-time" } },
          { "name": "sortBy", "in": "query", "schema": { "type": "string", "enum": ["createdAt", "updatedAt", "closedAt", "priority", "ticketNumber", "sequenceNumber"] } },
          { "name": "sortDirection", "in": "query", "schema": { "type": "string", "enum": ["asc", "desc"], "default": "desc" } }
        ],
        "responses": {
          "200": { "description": "Authorized ticket page", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/TicketListResponse" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" }
        }
      },
      "post": {
        "operationId": "createTicket",
        "summary": "Create a ticket in an authorized active Room",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CreateTicketRequest" } } } },
        "responses": {
          "201": { "description": "Ticket, number and history committed atomically", "headers": { "ETag": { "$ref": "#/components/headers/ETag" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/TicketResponse" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" }
        }
      }
    },
    "/tickets/{id}": {
      "parameters": [{ "$ref": "#/components/parameters/TicketId" }],
      "get": {
        "operationId": "getTicket",
        "summary": "Get an authorized ticket",
        "responses": {
          "200": { "description": "Safe Ticket DTO", "headers": { "ETag": { "$ref": "#/components/headers/ETag" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/TicketResponse" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      },
      "patch": {
        "operationId": "updateTicket",
        "summary": "Edit mutable fields on an OPEN ticket",
        "parameters": [{ "$ref": "#/components/parameters/IfMatch" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/UpdateTicketRequest" } } } },
        "responses": {
          "200": { "description": "Updated once", "headers": { "ETag": { "$ref": "#/components/headers/ETag" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/TicketResponse" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "428": { "$ref": "#/components/responses/PreconditionRequired" }
        }
      }
    },
    "/tickets/{id}/close": {
      "parameters": [{ "$ref": "#/components/parameters/TicketId" }],
      "post": {
        "operationId": "closeTicket",
        "summary": "Close an OPEN ticket",
        "parameters": [{ "$ref": "#/components/parameters/IfMatch" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CloseTicketRequest" } } } },
        "responses": {
          "200": { "description": "Closed ticket", "headers": { "ETag": { "$ref": "#/components/headers/ETag" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/TicketResponse" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "428": { "$ref": "#/components/responses/PreconditionRequired" }
        }
      }
    },
    "/tickets/{id}/history": {
      "parameters": [{ "$ref": "#/components/parameters/TicketId" }],
      "get": {
        "operationId": "listTicketHistory",
        "summary": "List authorized immutable history",
        "parameters": [
          { "$ref": "#/components/parameters/Page" },
          { "$ref": "#/components/parameters/HistoryLimit" },
          { "name": "sortDirection", "in": "query", "schema": { "type": "string", "enum": ["asc", "desc"], "default": "asc" } }
        ],
        "responses": {
          "200": { "description": "Safe history page", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/HistoryResponse" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      }
    }
  },
  "components": {
    "securitySchemes": { "bearerAuth": { "type": "http", "scheme": "bearer", "bearerFormat": "SSO access token" } },
    "headers": { "ETag": { "description": "Quoted explicit Ticket version", "schema": { "type": "string" } } },
    "parameters": {
      "TicketId": { "name": "id", "in": "path", "required": true, "schema": { "$ref": "#/components/schemas/ObjectId" } },
      "IfMatch": { "name": "If-Match", "in": "header", "required": true, "description": "Current version as 3 or quoted 3", "schema": { "type": "string" } },
      "View": { "name": "view", "in": "query", "schema": { "type": "string", "enum": ["OPEN", "MY_TASKS", "HISTORY"], "default": "OPEN" } },
      "Page": { "name": "page", "in": "query", "schema": { "type": "integer", "minimum": 1, "default": 1 } },
      "Limit": { "name": "limit", "in": "query", "schema": { "type": "integer", "minimum": 1, "maximum": 100, "default": 25 } },
      "HistoryLimit": { "name": "limit", "in": "query", "schema": { "type": "integer", "minimum": 1, "maximum": 100, "default": 50 } }
    },
    "schemas": {
      "ObjectId": { "type": "string", "pattern": "^[a-fA-F0-9]{24}$" },
      "TicketPriority": { "type": "string", "enum": ["LOW", "MEDIUM", "HIGH", "CRITICAL"] },
      "FieldValues": { "type": "object", "maxProperties": 100, "additionalProperties": true, "description": "JSON-safe object; maximum depth 4 and serialized size 64KB; unsafe keys are rejected." },
      "CreateTicketRequest": {
        "type": "object", "additionalProperties": false, "required": ["roomId", "subject", "description"],
        "properties": {
          "roomId": { "$ref": "#/components/schemas/ObjectId" },
          "subject": { "type": "string", "minLength": 3, "maxLength": 200 },
          "description": { "type": "string", "minLength": 1, "maxLength": 20000 },
          "priority": { "$ref": "#/components/schemas/TicketPriority" },
          "fieldValues": { "$ref": "#/components/schemas/FieldValues" }
        }
      },
      "UpdateTicketRequest": {
        "type": "object", "additionalProperties": false, "minProperties": 1,
        "properties": {
          "subject": { "type": "string", "minLength": 3, "maxLength": 200 },
          "description": { "type": "string", "minLength": 1, "maxLength": 20000 },
          "priority": { "$ref": "#/components/schemas/TicketPriority" },
          "fieldValues": { "$ref": "#/components/schemas/FieldValues" }
        }
      },
      "CloseTicketRequest": {
        "type": "object", "additionalProperties": false, "required": ["closureSummary"],
        "properties": { "closureSummary": { "type": "string", "minLength": 3, "maxLength": 5000 } }
      },
      "Capabilities": {
        "type": "object",
        "required": ["canView", "canEdit", "canClose", "isReadOnly", "readOnlyReason"],
        "properties": {
          "canView": { "type": "boolean" }, "canEdit": { "type": "boolean" }, "canClose": { "type": "boolean" },
          "canAssign": { "const": false }, "canTransfer": { "const": false },
          "canAcceptTransfer": { "const": false }, "canCancelTransfer": { "const": false },
          "canChangeCategory": { "const": false }, "canChangePin": { "const": false },
          "canWriteChat": { "const": false }, "isReadOnly": { "type": "boolean" },
          "readOnlyReason": { "type": ["string", "null"], "enum": ["TICKET_CLOSED", "INSUFFICIENT_ROLE", null] }
        }
      },
      "Ticket": {
        "type": "object",
        "required": ["id", "ticketNumber", "sequenceNumber", "systemId", "environmentId", "subEnvironmentId", "currentRoomId", "subject", "description", "priority", "fieldValues", "status", "version", "capabilities"],
        "properties": {
          "id": { "$ref": "#/components/schemas/ObjectId" }, "ticketNumber": { "type": "string" },
          "sequenceNumber": { "type": "integer", "minimum": 1 },
          "systemId": { "$ref": "#/components/schemas/ObjectId" },
          "environmentId": { "$ref": "#/components/schemas/ObjectId" },
          "subEnvironmentId": { "$ref": "#/components/schemas/ObjectId" },
          "originalRoomId": { "$ref": "#/components/schemas/ObjectId" },
          "currentRoomId": { "$ref": "#/components/schemas/ObjectId" },
          "visibleRoomIds": { "type": "array", "items": { "$ref": "#/components/schemas/ObjectId" }, "minItems": 1, "maxItems": 1 },
          "subject": { "type": "string" }, "description": { "type": "string" },
          "priority": { "$ref": "#/components/schemas/TicketPriority" },
          "fieldValues": { "$ref": "#/components/schemas/FieldValues" },
          "status": { "type": "string", "enum": ["OPEN", "CLOSED"] },
          "creator": { "type": "object" }, "activeAssigneeIds": { "type": "array", "items": { "$ref": "#/components/schemas/ObjectId" } },
          "closure": { "type": ["object", "null"] }, "version": { "type": "integer", "minimum": 1 },
          "createdAt": { "type": "string", "format": "date-time" }, "updatedAt": { "type": "string", "format": "date-time" },
          "capabilities": { "$ref": "#/components/schemas/Capabilities" }
        }
      },
      "Pagination": {
        "type": "object",
        "properties": {
          "page": { "type": "integer" }, "limit": { "type": "integer" }, "totalItems": { "type": "integer" },
          "totalPages": { "type": "integer" }, "hasNext": { "type": "boolean" }, "hasPrevious": { "type": "boolean" }
        }
      },
      "TicketResponse": { "type": "object", "properties": { "success": { "const": true }, "data": { "$ref": "#/components/schemas/Ticket" } } },
      "TicketListResponse": {
        "type": "object",
        "properties": {
          "success": { "const": true },
          "data": {
            "type": "object",
            "properties": {
              "items": { "type": "array", "items": { "$ref": "#/components/schemas/Ticket" } },
              "pagination": { "$ref": "#/components/schemas/Pagination" },
              "appliedFilters": { "type": "object" }, "sort": { "type": "object" }
            }
          }
        }
      },
      "HistoryEntry": {
        "type": "object",
        "properties": {
          "id": { "$ref": "#/components/schemas/ObjectId" }, "ticketId": { "$ref": "#/components/schemas/ObjectId" },
          "ticketNumber": { "type": "string" },
          "eventType": { "type": "string", "enum": ["TICKET_CREATED", "TICKET_UPDATED", "TICKET_CLOSED"] },
          "actor": { "type": "object" }, "versionBefore": { "type": "integer" }, "versionAfter": { "type": "integer" },
          "changedFields": { "type": "array", "items": { "type": "string" } },
          "changes": { "type": "object" }, "metadata": { "type": "object" },
          "createdAt": { "type": "string", "format": "date-time" }
        }
      },
      "HistoryResponse": {
        "type": "object",
        "properties": {
          "success": { "const": true },
          "data": {
            "type": "object",
            "properties": {
              "items": { "type": "array", "items": { "$ref": "#/components/schemas/HistoryEntry" } },
              "pagination": { "$ref": "#/components/schemas/Pagination" },
              "capabilities": { "$ref": "#/components/schemas/Capabilities" }
            }
          }
        }
      },
      "Error": {
        "type": "object",
        "properties": {
          "success": { "const": false },
          "error": {
            "type": "object",
            "properties": {
              "code": { "type": "string", "enum": ["TICKET_NOT_FOUND", "TICKET_ALREADY_CLOSED", "TICKET_NOT_OPEN", "TICKET_CREATE_FORBIDDEN", "TICKET_EDIT_FORBIDDEN", "TICKET_CLOSE_FORBIDDEN", "TICKET_SCOPE_INACTIVE", "TICKET_LINEAGE_MISMATCH", "TICKET_NUMBER_ALLOCATION_FAILED", "TICKET_HISTORY_WRITE_FAILED", "INVALID_TICKET_QUERY", "INVALID_TICKET_PRIORITY", "INVALID_TICKET_STATUS", "INVALID_FIELD_VALUES", "EMPTY_UPDATE", "PRECONDITION_REQUIRED", "VERSION_CONFLICT", "VALIDATION_ERROR", "FORBIDDEN", "INTERNAL_ERROR"] }, "message": { "type": "string" },
              "fieldErrors": { "type": ["object", "null"] }, "requestId": { "type": "string" }
            }
          }
        }
      }
    },
    "responses": {
      "BadRequest": { "description": "VALIDATION_ERROR, INVALID_TICKET_QUERY, INVALID_TICKET_PRIORITY, INVALID_TICKET_STATUS, INVALID_FIELD_VALUES or EMPTY_UPDATE", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "Unauthorized": { "description": "Missing or invalid SSO access token", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "Forbidden": { "description": "Provisioning, membership or mutation permission denied", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "NotFound": { "description": "Missing and unauthorized tickets are both TICKET_NOT_FOUND", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "Conflict": { "description": "VERSION_CONFLICT, TICKET_ALREADY_CLOSED or TICKET_NOT_OPEN", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } },
      "PreconditionRequired": { "description": "PRECONDITION_REQUIRED", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Error" } } } }
    }
  }
}

