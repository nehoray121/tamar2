{
  "openapi": "3.1.0",
  "info": { "title": "Tamar Shared Room Boards API", "version": "8.0.0", "description": "Shared Room-board metadata for OPEN, CLOSED, EXTERNAL_SENT and EXTERNAL_RECEIVED. Categories and pins are not global Ticket fields and are never personal. OPEN/CLOSED and sent/received states are independent; external identity is per Transfer. Board mutations do not change Ticket.version. Archived category references remain readable and removable. Generic Ticket capabilities outside this API remain context-free." },
  "servers": [{ "url": "/api" }],
  "security": [{ "bearerAuth": [] }],
  "paths": {
    "/rooms/{roomId}/boards/{boardType}/items": { "get": { "operationId": "listRoomBoardItems", "summary": "List eligible Board items with shared category and pin state", "parameters": [{ "$ref": "#/components/parameters/RoomId" }, { "$ref": "#/components/parameters/BoardType" }, { "$ref": "#/components/parameters/Page" }, { "$ref": "#/components/parameters/Limit" }, { "name": "search", "in": "query", "schema": { "type": "string", "maxLength": 100 } }, { "name": "categoryId", "in": "query", "schema": { "type": "string" } }, { "name": "categoryMode", "in": "query", "schema": { "enum": ["ALL", "CATEGORIZED", "UNCATEGORIZED"] } }, { "name": "pinMode", "in": "query", "schema": { "enum": ["ALL", "PINNED", "UNPINNED"] } }, { "name": "sortBy", "in": "query", "schema": { "type": "string" } }, { "name": "sortDirection", "in": "query", "schema": { "enum": ["asc", "desc"] } }], "responses": { "200": { "description": "Pinned-first, filtered and paginated Board items" }, "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" } } } },
    "/rooms/{roomId}/boards/{boardType}/categories": {
      "get": { "operationId": "listRoomBoardCategories", "parameters": [{ "$ref": "#/components/parameters/RoomId" }, { "$ref": "#/components/parameters/BoardType" }], "responses": { "200": { "description": "Room-board categories" }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" } } },
      "post": { "operationId": "createRoomBoardCategory", "parameters": [{ "$ref": "#/components/parameters/RoomId" }, { "$ref": "#/components/parameters/BoardType" }], "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CategoryMutation" } } } }, "responses": { "201": { "description": "Shared category created" }, "400": { "$ref": "#/components/responses/BadRequest" }, "409": { "$ref": "#/components/responses/Conflict" } } }
    },
    "/rooms/{roomId}/boards/{boardType}/categories/{categoryId}": { "patch": { "operationId": "updateRoomBoardCategory", "parameters": [{ "$ref": "#/components/parameters/RoomId" }, { "$ref": "#/components/parameters/BoardType" }, { "$ref": "#/components/parameters/CategoryId" }, { "$ref": "#/components/parameters/IfMatch" }], "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CategoryMutation" } } } }, "responses": { "200": { "description": "Category updated with one version increment" }, "428": { "$ref": "#/components/responses/Precondition" }, "409": { "$ref": "#/components/responses/Conflict" } } } },
    "/rooms/{roomId}/boards/{boardType}/categories/{categoryId}/archive": { "post": { "operationId": "archiveRoomBoardCategory", "parameters": [{ "$ref": "#/components/parameters/RoomId" }, { "$ref": "#/components/parameters/BoardType" }, { "$ref": "#/components/parameters/CategoryId" }, { "$ref": "#/components/parameters/IfMatch" }], "requestBody": { "content": { "application/json": { "schema": { "type": "object", "additionalProperties": false, "maxProperties": 0 } } } }, "responses": { "200": { "description": "Category soft-archived; existing item references remain" }, "428": { "$ref": "#/components/responses/Precondition" }, "409": { "$ref": "#/components/responses/Conflict" } } } },
    "/rooms/{roomId}/boards/{boardType}/items/{itemId}/state": {
      "get": { "operationId": "getRoomBoardItemState", "parameters": [{ "$ref": "#/components/parameters/RoomId" }, { "$ref": "#/components/parameters/BoardType" }, { "$ref": "#/components/parameters/ItemId" }], "responses": { "200": { "description": "Persisted state or virtual version-0 state", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/BoardState" } } } }, "404": { "$ref": "#/components/responses/NotFound" } } },
      "patch": { "operationId": "updateRoomBoardItemState", "parameters": [{ "$ref": "#/components/parameters/RoomId" }, { "$ref": "#/components/parameters/BoardType" }, { "$ref": "#/components/parameters/ItemId" }, { "$ref": "#/components/parameters/IfMatch" }], "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/BoardStateMutation" } } } }, "responses": { "200": { "description": "Shared state updated atomically and one realtime event published" }, "400": { "$ref": "#/components/responses/BadRequest" }, "409": { "$ref": "#/components/responses/Conflict" }, "428": { "$ref": "#/components/responses/Precondition" } } }
    }
  },
  "components": {
    "securitySchemes": { "bearerAuth": { "type": "http", "scheme": "bearer", "bearerFormat": "JWT" } },
    "parameters": {
      "RoomId": { "name": "roomId", "in": "path", "required": true, "schema": { "type": "string", "pattern": "^[0-9a-fA-F]{24}$" } },
      "BoardType": { "name": "boardType", "in": "path", "required": true, "schema": { "enum": ["OPEN", "CLOSED", "EXTERNAL_SENT", "EXTERNAL_RECEIVED"] } },
      "CategoryId": { "name": "categoryId", "in": "path", "required": true, "schema": { "type": "string" } },
      "ItemId": { "name": "itemId", "in": "path", "required": true, "description": "Ticket ID for OPEN/CLOSED; Transfer ID for external Boards", "schema": { "type": "string" } },
      "Page": { "name": "page", "in": "query", "schema": { "type": "integer", "minimum": 1, "default": 1 } },
      "Limit": { "name": "limit", "in": "query", "schema": { "type": "integer", "minimum": 1, "maximum": 100, "default": 25 } },
      "IfMatch": { "name": "If-Match", "in": "header", "required": true, "description": "Category/state numeric version; use 0 for virtual Board state", "schema": { "type": "string" } }
    },
    "schemas": {
      "CategoryMutation": { "type": "object", "additionalProperties": false, "properties": { "name": { "type": "string", "minLength": 1, "maxLength": 100 }, "description": { "type": ["string", "null"], "maxLength": 500 }, "color": { "type": ["string", "null"], "pattern": "^#[0-9A-F]{6}$" } } },
      "CategorySummary": { "type": ["object", "null"], "properties": { "id": { "type": "string" }, "name": { "type": "string" }, "color": { "type": ["string", "null"] }, "isActive": { "type": "boolean" }, "version": { "type": "integer" } } },
      "BoardStateMutation": { "type": "object", "additionalProperties": false, "minProperties": 1, "properties": { "categoryId": { "type": ["string", "null"] }, "isPinned": { "type": "boolean" } } },
      "BoardState": { "type": "object", "required": ["category", "isPinned", "pinnedAt", "version", "capabilities"], "properties": { "category": { "$ref": "#/components/schemas/CategorySummary" }, "isPinned": { "type": "boolean" }, "pinnedAt": { "type": ["string", "null"], "format": "date-time" }, "version": { "type": "integer", "minimum": 0 }, "capabilities": { "type": "object", "properties": { "canChangeCategory": { "type": "boolean" }, "canChangePin": { "type": "boolean" } } } } }
    },
    "responses": {
      "BadRequest": { "description": "VALIDATION_ERROR, INVALID_BOARD_QUERY, INVALID_CATEGORY_NAME, INVALID_CATEGORY_COLOR, EMPTY_BOARD_STATE_UPDATE or EMPTY_CATEGORY_UPDATE" },
      "Unauthorized": { "description": "Bearer authentication required" },
      "Forbidden": { "description": "FORBIDDEN, BOARD_ACCESS_FORBIDDEN or BOARD_SCOPE_INACTIVE" },
      "NotFound": { "description": "BOARD_NOT_FOUND, BOARD_ITEM_NOT_FOUND or BOARD_CATEGORY_NOT_FOUND without cross-scope disclosure" },
      "Conflict": { "description": "BOARD_CATEGORY_DUPLICATE, BOARD_CATEGORY_ARCHIVED, BOARD_CATEGORY_VERSION_CONFLICT or BOARD_STATE_VERSION_CONFLICT" },
      "Precondition": { "description": "PRECONDITION_REQUIRED" }
    }
  },
  "x-board-rules": { "sharedScope": "room + boardType + Ticket/Transfer identity", "noPersonalCategories": true, "noPersonalPinning": true, "noPersonalOrdering": true, "externalStatePerTransfer": true, "pinnedFirstBeforePagination": true },
  "x-realtime-events": ["board:category-created", "board:category-updated", "board:category-archived", "board:item-state-updated"],
  "x-error-codes": ["BOARD_NOT_FOUND", "BOARD_ACCESS_FORBIDDEN", "BOARD_SCOPE_INACTIVE", "BOARD_ITEM_NOT_FOUND", "BOARD_ITEM_NOT_ELIGIBLE", "BOARD_TYPE_INVALID", "BOARD_ITEM_TYPE_MISMATCH", "BOARD_CATEGORY_NOT_FOUND", "BOARD_CATEGORY_DUPLICATE", "BOARD_CATEGORY_ARCHIVED", "BOARD_CATEGORY_SCOPE_MISMATCH", "BOARD_CATEGORY_VERSION_CONFLICT", "BOARD_STATE_VERSION_CONFLICT", "EMPTY_BOARD_STATE_UPDATE", "EMPTY_CATEGORY_UPDATE", "INVALID_CATEGORY_NAME", "INVALID_CATEGORY_COLOR", "INVALID_BOARD_QUERY", "PRECONDITION_REQUIRED", "VALIDATION_ERROR", "FORBIDDEN", "INTERNAL_ERROR"]
}
